app-id: org.oneal.CrashSentinel
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: CrashSentinel
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
modules:
  - name: CrashSentinel
    buildsystem: cmake-ninja
    sources:
      - type: dir
        path: .
